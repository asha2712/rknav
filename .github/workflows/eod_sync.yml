name: Daily EOD Price Sync

on:
  schedule:
    # 18:15 UTC = 11:45 PM IST
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download AMFI NAV feed via curl
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Accept: text/plain, */*" \
            "https://www.amfiindia.com/spages/NAVAll.txt" -o amfi_nav.txt
          echo "AMFI file size: $(wc -c < amfi_nav.txt) bytes"

      - name: Run sync script
        run: python rk_sync_eod.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add eod_prices.json
          git diff --staged --quiet || (git commit -m "Update prices $(date +'%Y-%m-%d')" && git push)
